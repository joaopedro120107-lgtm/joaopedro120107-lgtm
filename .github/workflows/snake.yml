name: Generate Purple Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: joaopedro120107-lgtm
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#2E1065,#6D28D9,#A855F7,#E9D5FF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
